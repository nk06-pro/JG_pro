<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오메가 | 로비</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

    <!-- 타이틀용 픽셀 폰트 + 본문용 Jua -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Flask static 폴더 안의 style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- 배경 장식: 별빛 + CRT 스캔라인 (움직임 최소화 환경에서는 자동으로 정지됨) -->
    <div class="bg-stars" aria-hidden="true"></div>
    <div class="bg-scanlines" aria-hidden="true"></div>

    <!-- 배경음악: static/audio/ 안에 파일을 넣고 아래 src만 실제 파일명으로 바꾸면 됩니다 -->
    <audio id="bgm" src="/static/audio/bgm.mp3" loop preload="auto"></audio>
    <audio id="sfx-dice" src="/static/audio/dice_roll.mp3" preload="auto"></audio>
    <button id="btn-mute" class="mute-btn" type="button" title="배경음악 켜기/끄기">🔇</button>

    <div class="wrap">

        <!-- 1. 타이틀 화면 -->
        <div id="title-screen">
            <div class="mytitle">
                <div class="mytitle-crt">
                    <!-- 실제 3D 큐브 다이스 (인게임과 동일한 구조 재사용, JS가 채워넣음) -->
                    <div id="title-die" class="die3d title-die"></div>
                    <h1>MULTY ARENA</h1>
                    <p>친구와 함께, 실시간으로 즐기는 미니게임</p>
                    <p class="insert-coin">PRESS START ▾</p>
                </div>
            </div>

            <div class="menu-box">
                <div class="mb-3">
                    <input id="input-name" type="text" class="form-control" maxlength="8" placeholder="닉네임을 입력하세요">
                </div>

                <button id="btn-create" class="btn btn-arcade w-100 mb-2">🛠 방 만들기</button>
                <button id="btn-show-join" class="btn btn-arcade-outline w-100">🔑 방 참가하기</button>

                <!-- 참가 코드 입력 (평소엔 숨김) -->
                <div id="join-area" class="mt-3" style="display:none;">
                    <div class="join-row">
                        <input id="input-code" type="text" class="form-control" maxlength="6"
                            placeholder="6자리 코드" style="text-transform:uppercase;">
                        <button id="btn-join" class="btn btn-arcade">참가</button>
                    </div>
                </div>

                <div id="alert-box" class="alert alert-danger mt-3" style="display:none;"></div>
            </div>
        </div>

        <!-- 2. 대기실 화면 (방 생성/참가 후) -->
        <div id="room-screen" style="display:none;">
            <div class="mytitle mytitle-small">
                <div class="mytitle-crt">
                    <h2 id="room-code-display">------</h2>
                    <p>방 코드를 공유하세요</p>
                </div>
            </div>

            <div class="menu-box text-center">
                <div id="waiting-area">
                    <p id="status-msg">상대방을 기다리는 중...</p>
                    <div class="spinner-border text-light" role="status"></div>
                    <div id="waiting-player-list" class="mt-3"></div>
                    <button id="btn-ready" class="btn btn-arcade w-100 mt-2" style="display:none;">✅ 준비하기</button>
                    <button id="btn-leave-waiting" class="btn btn-arcade-outline w-100 mt-3">로비로 나가기</button>
                </div>

                <div id="connected-area" style="display:none;">
                    <!-- 인게임 전용: 작은 X 버튼 (ESC 로도 나가짐) -->
                    <button id="btn-leave-game" class="corner-leave-btn" type="button" title="나가기 (ESC)">✕</button>

                    <div class="game-board">
                        <div class="score-panel">
                            <div class="score-panel-header">
                                <span id="turn-counter" class="turn-counter">Turn -/12</span>
                                <div id="player-avatars" class="player-avatars"></div>
                            </div>
                            <p class="turn-indicator" id="turn-indicator">-</p>
                            <div id="score-grid" class="score-grid"></div>
                        </div>

                        <div class="dice-panel">
                            <div class="dice-tray-visual">
                                <div class="dice-scene" id="dice-tray"></div>
                            </div>
                            <button id="btn-roll" class="btn btn-arcade w-100">🎲 굴리기</button>
                        </div>
                    </div>
                </div>

                <!-- 이모티콘 리액션 바 (JS가 버튼을 동적으로 채워넣음) -->
                <div id="emoji-bar" class="emoji-bar mt-3"></div>
            </div>

            <!-- 떠오르는 이모티콘 리액션이 표시되는 레이어 -->
            <div id="reaction-layer" class="reaction-layer"></div>
        </div>

        <!-- 3. 미연시(비주얼 노벨) — 기본 뼈대. 이미지는 static/vn/ 아래에 넣고 script.js의 VN_SCRIPT 경로만 맞추면 됨 -->
        <div id="secret-screen" style="display:none;">
            <div class="vn-root">
                <div class="vn-stage" id="vn-stage">
                    <div id="vn-bg-placeholder" class="vn-placeholder">
                        🖼 배경 이미지<br /><span>static/vn/backgrounds/ 에 파일을 넣고<br />VN_SCRIPT의 background 경로를 맞춰주세요</span>
                    </div>
                    <img id="vn-background" class="vn-background" alt="" style="display:none;" />

                    <div id="vn-char-placeholder" class="vn-placeholder vn-char-placeholder">
                        🧑 캐릭터 이미지<br /><span>static/vn/characters/ 에 파일을 넣고<br />VN_SCRIPT의 character 경로를 맞춰주세요</span>
                    </div>
                    <img id="vn-character" class="vn-character" alt="" style="display:none;" />
                </div>

                <div class="vn-textbox" id="vn-textbox">
                    <div class="vn-name-tag" id="vn-name">???</div>
                    <p class="vn-line" id="vn-line">-</p>
                    <span class="vn-next-hint" id="vn-next-hint">다음 ▸</span>
                </div>

                <button id="btn-secret-back" class="btn btn-arcade-outline w-100">← 돌아가기</button>
            </div>
        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Socket.io 클라이언트 (Node.js/Render 백엔드에 접속) -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <!-- Flask static 폴더 안의 script.js -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
