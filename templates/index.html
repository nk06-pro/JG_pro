<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멀티 아레나 | 로비</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">

    <!-- 타이틀용 픽셀 폰트 + 본문용 Jua -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Flask static 폴더 안의 style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- 배경 장식: 별빛 + CRT 스캔라인 (움직임 최소화 환경에서는 자동으로 정지됨) -->
    <div class="bg-stars" aria-hidden="true"></div>
    <div class="bg-scanlines" aria-hidden="true"></div>

    <div class="wrap">

        <!-- 1. 타이틀 화면 -->
        <div id="title-screen">
            <div class="mytitle">
                <div class="mytitle-crt">
                    <!-- 픽셀 아트 주사위 아이콘 (외부 이미지 없이 SVG로 직접 그림) -->
                    <svg class="pixel-dice" width="40" height="40" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                        <rect x="1" y="1" width="14" height="14" fill="#e43f5a" stroke="#ffffff" stroke-width="1"/>
                        <rect x="3" y="3" width="2" height="2" fill="#ffe600"/>
                        <rect x="11" y="3" width="2" height="2" fill="#ffe600"/>
                        <rect x="7" y="7" width="2" height="2" fill="#ffe600"/>
                        <rect x="3" y="11" width="2" height="2" fill="#ffe600"/>
                        <rect x="11" y="11" width="2" height="2" fill="#ffe600"/>
                    </svg>
                    <h1>MULTI ARENA</h1>
                    <p>친구와 함께, 실시간으로 즐기는 미니게임</p>
                    <p class="insert-coin">PRESS START ▾</p>
                </div>
            </div>

            <div class="menu-box">
                <div class="mb-3">
                    <input id="input-name" type="text" class="form-control" maxlength="8" placeholder="닉네임을 입력하세요">
                </div>

                <button id="btn-create" class="btn btn-arcade w-100 mb-2">🛠 방 만들기</button>
                <button id="btn-show-join" class="btn btn-arcade-outline w-100">🔑 방 참가하기</button>

                <!-- 참가 코드 입력 (평소엔 숨김) -->
                <div id="join-area" class="mt-3" style="display:none;">
                    <div class="d-flex gap-2">
                        <input id="input-code" type="text" class="form-control" maxlength="6"
                            placeholder="6자리 코드" style="text-transform:uppercase;">
                        <button id="btn-join" class="btn btn-arcade">참가</button>
                    </div>
                </div>

                <div id="alert-box" class="alert alert-danger mt-3" style="display:none;"></div>
            </div>
        </div>

        <!-- 2. 대기실 화면 (방 생성/참가 후) -->
        <div id="room-screen" style="display:none;">
            <div class="mytitle mytitle-small">
                <div class="mytitle-crt">
                    <h2 id="room-code-display">------</h2>
                    <p>방 코드를 공유하세요</p>
                </div>
            </div>

            <div class="menu-box text-center">
                <div id="waiting-area">
                    <p id="status-msg">상대방을 기다리는 중...</p>
                    <div class="spinner-border text-light" role="status"></div>
                </div>

                <div id="connected-area" style="display:none;">
                    <p class="connected-msg">✅ 연결 완료!</p>
                    <div id="player-list"></div>
                    <p class="hint-text">여기부터 실제 게임 화면으로 이어집니다.</p>
                </div>

                <button id="btn-leave" class="btn btn-arcade-outline w-100 mt-3">로비로 나가기</button>

                <!-- 이모티콘 리액션 바 (JS가 버튼을 동적으로 채워넣음) -->
                <div id="emoji-bar" class="emoji-bar mt-3"></div>
            </div>

            <!-- 떠오르는 이모티콘 리액션이 표시되는 레이어 -->
            <div id="reaction-layer" class="reaction-layer"></div>
        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Socket.io 클라이언트 (Node.js/Render 백엔드에 접속) -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <!-- Flask static 폴더 안의 script.js -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
