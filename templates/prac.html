<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>fake google</title>

<style>
    .main{
        text-align: center;
        margin-top : 100px;
    }

    .header{
        display:flex;
        justify-content: flex-end;
        align-items: center;
        gap:15px;
        margin-right: 20px;
        margin-top : 20px;
    }
    
    .option-box{
        padding:8px 12px;
        border:none;
        background:transparent;
        cursor:pointer;
        font-size: 13px;

    }

    .option-box:hover {
        text-decoration: underline; /* 마우스 올리면 밑줄 생기게 */
    }

    .google-logo{
        margin : 0 auto 20px auto;
        display:block;
    }
    
    @keyframes earthquake {
        0% { transform: translate(0, 0) rotate(0deg); }
        20% { transform: translate(-10px, 5px) rotate(-2deg); }
        40% { transform: translate(10px, -5px) rotate(2deg); }
        60% { transform: translate(-5px, -10px) rotate(1deg); }
        80% { transform: translate(5px, 10px) rotate(-1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-mode {
        animation: earthquake 1s ease;
    }

    .search-box {
        display: flex;
        justify-content: center;
        align-items: center; 
        gap: 8px;            
    }

    .search-input{
        width: 400px;
        height: 40px;
        border-radius:24px;
        border:1px solid #dfe1e5;
        padding: 0 20px;
        font-size: 16px;
        outline: none;

    }

    .search-btn{
        height: 42px;
        padding:0 15px;
        border:1px solid #f8f9fa;
        background-color:#f8f9fa;
        border-radius: 4px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
    }
    .search-btn:hover{
        border : 1px solid #dadce0;
        box-shadow: 0 1px 1px rgba(0, 0, 0,0.1);
    }

    .foot{
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* 푸터 판 자체는 클릭을 방해하지 않게 설정 */
    }

    /* 각 버튼들이 독립적으로 위치를 가질 수 있도록 설정 및 클릭 허용(pointer-events: auto) */
    .foot button {
        pointer-events: auto;
        position: absolute;
        padding: 10px 15px;
        border: 1px solid #dadce0;
        background-color: #f8f9fa;
        cursor: pointer;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 1단계 버튼: 왼쪽 아래 구석 */
    #btn1 {
        bottom: 30px;
        left: 50px;
    }

    /* 2단계 버튼: 화면 정중앙 위쪽 */
    #btn2 {
        top: 40%;
        left: 45%;
    }

    /* 3단계 버튼: 오른쪽 위 구석 */
    #btn3 {
        top: 100px;
        right: 80px;
    }

</style>
</head>
<body>
    <header class="header">
        <button class="option-box" onclick= mission()>gmail</button>
        <button class="option-box" onclick= waffle()><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-jRrHlnY24i4UE_zBTiPixfmi0U5FIR74AhizbNxQLQ&s=10" width = "20"></button>
        <button class="option-box" onclick = joke()>로그인</button>

    
    </header>
    
    <main class="main">
        
        <img class="google-logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="272" onclick="startEarthquake()">
        <div class="search-box">
            <input type="text" class="search-input" />
            <button class="search-btn" id="runawayBtn" onmouseover="moveButton()">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSrE44A42ElSRUenAJtB4iFyEP974JZ_H7fnrKEQGWJbw&s=10" width="20">
            </button>
        </div>

        

    </main>

    <footer class="foot">
     <button id="btn1" style="display: none;" onclick ="mission2()">이걸 눌러?</button>
     <button id="btn2" style="display: none;" onclick ="mission3()">그만해 더 없어</button>
     <button id="btn3" style="display: none;" onclick ="lastmission()"><a href="https://youtu.be/H4dGpz6cnHo?si=vX8BWOpH3Dfqq04u&t=45">마지막 경고야 누르지마</a></button>
    </footer>
    

    <script>
        function waffle()
        {
            const width = screen.width;
            const height = screen.height;
            window.open('https://www.waffleuniv.com/', '_blank', `width=${width},height=${height},left=0,top=0`);
        }
        
       function startEarthquake() {
        // body 전체 요소를 가져옵니다
        const body = document.body;
        
        // 'shake-mode' 클래스를 추가해 지진 시작!
        body.classList.add('shake-mode');
        
        // 0.5초(애니메이션 끝나는 시간) 뒤에 클래스를 제거하여 원래대로 돌려놓음
        setTimeout(function() {
            body.classList.remove('shake-mode');
        }, 1000);
        }

        function moveButton() {
            const btn = document.getElementById('runawayBtn');
            
            // 화면 안에서 무작위로 이동할 X, Y 좌표를 계산합니다 (-200px ~ 200px 사이)
            const randomX = Math.floor(Math.random() * 400) - 200;
            const randomY = Math.floor(Math.random() * 300) - 150;
            
            // 버튼의 위치를 상대적으로 움직이게 만듭니다
            btn.style.position = 'relative';
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            btn.style.transition = 'transform 0.2s ease'; // 부드럽게 휙 도망가도록 설정
        }

        function joke(){

            alert("나약한 당신은 로그인 할 수 없습니다!");

        }

        function mission(){
            const footerElement = document.querySelector('.foot');
            footerElement.style.display = 'block';
            document.getElementById('btn1').style.display = 'inline-block';
        }

        function mission2(){
            document.getElementById('btn2').style.display = 'inline-block';
        }

        function mission3(){
            alert("그만하자 진짜 더는 없다.....");
            document.getElementById('btn3').style.display = 'inline-block';
        }

        function lastmission(){
            alert("너가 누른거야");
            
            // 1단계 시도: 강제 창 닫기 시도
            window.open('about:blank', '_self').close();
        }
    </script>
</body>
</html>
